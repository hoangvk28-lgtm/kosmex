# Static export: Next.js writes the full site to /out (no server runtime needed).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # Set to "true" once Kosmex confirms Netlify Forms notifications reach the
  # sales inbox. While "false", the RFQ form shows a preview notice.
  NEXT_PUBLIC_RFQ_LIVE = "false"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Legacy wireframe hash routes cannot be redirected server-side; common
# old-site product URLs are mapped instead.
[[redirects]]
  from = "/product/film-faced-plywood/"
  to = "/products/film-faced-plywood/"
  status = 301
[[redirects]]
  from = "/certification/"
  to = "/certificates/"
  status = 301
